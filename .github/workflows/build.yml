# Modified by INDO-GO GeoSpatial, 2026-11-25: offline policy checks and least privilege.
name: Cek dan build plugin

on:
  push:
    branches: [main, branding/indo-go-v0.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek sintaks Python
        run: python -m py_compile indo_go_geospatial/*.py tests/*.py

      - name: Cek metadata.txt dan config.json
        run: python tests/ci_check.py

      - name: Offline security policy tests
        run: python tests/security_check.py

      - name: Simulated QGIS lifecycle tests
        run: python tests/lifecycle_check.py

      - name: Local raster validation tests
        run: python tests/local_raster_check.py

      - name: Simulated local raster workflow
        run: python tests/raster_workflow_check.py

      - name: Parcel analyzer unit tests
        run: python tests/parcel_check.py

      - name: Build ZIP plugin
        run: |
          python build_zip.py
          ls dist/*.zip

      - name: Cek isi ZIP
        run: python tests/ci_check.py dist/*.zip

      - name: Simpan ZIP sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: indo_go_geospatial-zip
          path: dist/*.zip
          retention-days: 14
